{{ define "main" }}
  {{ partial "page-title.html" . }}

  {{ if .Pages }}
    <section class="pages-list">
      <ul class="grid">
        {{ range .Pages }}
          <li class="grid-item">
            <a href="{{ .RelPermalink }}" class="page-link">
              <strong>{{ .Title }}</strong>
            </a>
          </li>
        {{ end }}
      </ul>
    </section>
  {{ end }}
{{ end }}

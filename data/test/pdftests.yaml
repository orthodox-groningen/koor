
# =========================================================
# BEHEERCONSTRAINTS (VERPLICHT)
#
# 1. ALTIJD EXACT 1 ROOT KEY: items
# 2. ALLE NODES MOETEN EEN type HEBBEN:
#    - group
#    - item
#    - include
#    - link
#
# 3. group:
#    - title (verplicht)
#    - base (optioneel)
#    - items (verplicht)
#
# 4. item:
#    - title (optioneel)
#    - file (verplicht of in combinatie met dir)
#    - dir (optioneel)
#
# 5. GEEN EXTRA ROOT STRUCTUREN (dus nooit "tests:" gebruiken)
# =========================================================

items:

  - type: group
    title: "PDF test lijst"
    base: "koormappen/testmap"
    items:
      - type: item
        title: "Testlied"
        file: "test"
      - type: item
        title: "Test-A"
        file: "test-A"
      - type: item
        title: "Kruisje"
        dir: "images"
        file: "kruisje"


# =========================================================
# BEHEERCONSTRAINTS (VERPLICHT)
#
# 1. ALTIJD EXACT 1 ROOT KEY: items
# 2. ALLE NODES MOETEN EEN type HEBBEN:
#    - group
#    - item
#    - include
#    - link
#
# 3. group:
#    - title (verplicht)
#    - base (optioneel)
#    - items (verplicht)
#
# 4. item:
#    - title (optioneel)
#    - file (verplicht of in combinatie met dir)
#    - dir (optioneel)
#
# 5. GEEN EXTRA ROOT STRUCTUREN (dus nooit "tests:" gebruiken)
# =========================================================

items:

  - type: group
    title: "Test 1 - eenvoudige item-list"
    base: "koormappen/testmap"
    items:

      - type: item
        file: "test-2-A.mp3"
        title: "test-2-A.mp3"

      - type: item
        dir: "images"
        file: "kruisje.jpg"
        title: "kruisje.jpg"

  - type: group
    title: "Test 2 - nesting 2 diep"
    base: "koormappen"
    items:

      - type: group
        base: "testmap"
        title: "testmap"
        items:

          - type: item
            file: "test-2-A.mp3"
            title: "test-2-A.mp3"

          - type: item
            dir: "images"
            file: "kruisje.jpg"
            title: "kruisje.jpg"

  - type: group
    title: "Test 3 - nesting 3 diep"
    base: "koormappen"
    items:

      - type: group
        base: "testmap"
        title: "testmap"
        items:

          - type: group
            base: "images"
            title: "images"
            items:

              - type: item
                file: "kruisje.jpg"
                title: "kruisje.jpg"

              - type: item
                dir: "api"
                file: "nestest.md"
                title: "nestest.md"